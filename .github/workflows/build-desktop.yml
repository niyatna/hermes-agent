name: Build & Release Desktop

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build target'
        required: true
        type: choice
        options:
          - 'latest-release'
          - 'latest-commit'
          - 'custom-ref'
        default: 'latest-release'
      custom_ref:
        description: 'Tag name or commit SHA (only used if build_target is custom-ref)'
        required: false
        default: ''
      publish_release:
        description: 'Create a GitHub Release with assets'
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '0 4 * * *' # Daily at 04:00 UTC

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Determine Upstream Ref & Release Metadata
        id: meta
        run: |
          TARGET="${{ inputs.build_target || 'latest-release' }}"

          if [ "$TARGET" = "custom-ref" ] && [ -n "${{ inputs.custom_ref }}" ]; then
            REF="${{ inputs.custom_ref }}"
            TAG="$REF"
            TITLE="Hermes Desktop $TAG"
            CLEAN_VER="0.20.7"
          elif [ "$TARGET" = "latest-commit" ]; then
            LATEST_SHA=$(curl -s https://api.github.com/repos/NousResearch/hermes-agent/commits/main | jq -r '.sha // empty')
            SHORT_SHA="${LATEST_SHA:0:7}"
            DATE_STR=$(date -u +'%Y.%m.%d')
            DATE_SEMVER=$(date -u +'%Y.%-m.%-d')
            REF="main"
            TAG="nightly-${DATE_STR}-${SHORT_SHA}"
            TITLE="Hermes Desktop Nightly (${DATE_STR} - ${SHORT_SHA})"
            CLEAN_VER="${DATE_SEMVER}"
          else
            UPSTREAM_TAG=$(curl -s https://api.github.com/repos/NousResearch/hermes-agent/releases/latest | jq -r '.tag_name // empty')
            if [ -z "$UPSTREAM_TAG" ]; then
              UPSTREAM_TAG=$(curl -s https://api.github.com/repos/NousResearch/hermes-agent/tags | jq -r '.[0].name // empty')
            fi
            REF="$UPSTREAM_TAG"
            TAG="$UPSTREAM_TAG"
            TITLE="Hermes Agent Desktop $TAG"
            CLEAN_VER="${TAG#v}"
          fi

          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "version=$CLEAN_VER" >> "$GITHUB_OUTPUT"
          echo "Target Ref: $REF | Release Tag: $TAG | Version: $CLEAN_VER"

      - name: Check if Release Already Exists
        id: check_release
        if: github.event_name == 'schedule'
        run: |
          EXISTS=$(gh release view "${{ steps.meta.outputs.tag }}" --repo "${{ github.repository }}" --json tagName -q .tagName 2>/dev/null || echo "")
          if [ -n "$EXISTS" ]; then
            echo "Release ${{ steps.meta.outputs.tag }} already exists. Skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Code from Upstream (NousResearch/hermes-agent)
        if: steps.check_release.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: 'NousResearch/hermes-agent'
          ref: ${{ steps.meta.outputs.ref }}
          fetch-depth: 1

      - name: Setup Node.js
        if: steps.check_release.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        if: steps.check_release.outputs.skip != 'true'
        run: |
          npm ci --include=dev --workspaces --no-audit --ignore-scripts
          npm pkg set version=${{ steps.meta.outputs.version }} --prefix apps/desktop
          cd apps/desktop
          npm rebuild node-pty

      - name: Apply Niyatna Customizations (System Tray & Native GTK Controls)
        if: steps.check_release.outputs.skip != 'true'
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const mainTsPath = path.join(process.cwd(), 'apps/desktop/electron/main.ts');
          if (!fs.existsSync(mainTsPath)) {
            console.error('[niyatna-patch] main.ts not found');
            process.exit(1);
          }
          let code = fs.readFileSync(mainTsPath, 'utf8');

          // 1. Return false for Linux in getTitleBarOverlayOptions
          if (code.includes('function getTitleBarOverlayOptions() {') && !code.includes('if (IS_LINUX) {\n    return false\n  }')) {
            code = code.replace(
              'function getTitleBarOverlayOptions() {',
              'function getTitleBarOverlayOptions() {\n  if (IS_LINUX) {\n    return false\n  }'
            );
            console.log('[niyatna-patch] ✓ Disabled titleBarOverlay on Linux');
          }

          // 2. Native GTK Frame for Linux in BrowserWindow options
          const targetWin = \`    titleBarStyle: 'hidden',
    titleBarOverlay: getTitleBarOverlayOptions(),
    trafficLightPosition: IS_MAC ? WINDOW_BUTTON_POSITION : undefined,\`;

          const replaceWin = \`    ...(IS_LINUX
      ? { frame: true, titleBarStyle: 'default' as const, titleBarOverlay: false }
      : {
          titleBarStyle: 'hidden' as const,
          titleBarOverlay: getTitleBarOverlayOptions(),
          trafficLightPosition: IS_MAC ? WINDOW_BUTTON_POSITION : undefined
        }),\`;

          if (code.includes(targetWin)) {
            code = code.replace(targetWin, replaceWin);
            console.log('[niyatna-patch] ✓ Set native GTK frame options for Linux');
          }

          // 3. System Tray & Close-to-Tray logic
          const targetTrayHook = '  const createdMainWindow = mainWindow';
          const trayCode = \`  // System Tray Setup
  if (!(global as any).appTray) {
    const iconPath = getAppIconPath();
    if (iconPath) {
      try {
        const { Tray, Menu } = require('electron');
        const tray = new Tray(iconPath);
        ;(global as any).appTray = tray;
        const contextMenu = Menu.buildFromTemplate([
          {
            label: 'Show Hermes',
            click: () => {
              if (mainWindow) {
                mainWindow.show();
                mainWindow.focus();
              }
            }
          },
          {
            label: 'Quit',
            click: () => {
              ;(app as any).isQuiting = true;
              app.quit();
            }
          }
        ]);
        tray.setToolTip('Hermes Desktop');
        tray.setContextMenu(contextMenu);
        tray.on('click', () => {
          if (mainWindow) {
            if (mainWindow.isVisible()) {
              mainWindow.hide();
            } else {
              mainWindow.show();
              mainWindow.focus();
            }
          }
        });
      } catch (e) {
        console.error('Failed to create system tray:', e);
      }
    }
  }

  // Minimize to tray on close
  mainWindow.on('close', (event) => {
    if (!(app as any).isQuiting) {
      event.preventDefault();
      mainWindow.hide();
      return false;
    }
  });

  const createdMainWindow = mainWindow\`;

          if (code.includes(targetTrayHook) && !code.includes('// System Tray Setup')) {
            code = code.replace(targetTrayHook, trayCode);
            console.log('[niyatna-patch] ✓ Injected System Tray and Close-to-Tray logic');
          }

          fs.writeFileSync(mainTsPath, code, 'utf8');
          console.log('[niyatna-patch] Patch successfully applied!');
          "

      - name: Build & Package Desktop App
        if: steps.check_release.outputs.skip != 'true'
        env:
          GITHUB_SHA: ${{ steps.meta.outputs.ref }}
          GITHUB_REF_NAME: ${{ steps.meta.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          cd apps/desktop
          npm run build
          npm run builder -- --linux deb AppImage --publish never

      - name: Upload Artifacts
        if: steps.check_release.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hermes-desktop-linux-${{ steps.meta.outputs.tag }}
          path: |
            apps/desktop/release/*.deb
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.yaml

      - name: Publish GitHub Release
        if: steps.check_release.outputs.skip != 'true' && (inputs.publish_release != false || github.event_name == 'schedule')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "${{ steps.meta.outputs.title }}"
          body: |
            Automated Desktop build for Hermes Agent [${{ steps.meta.outputs.ref }}](https://github.com/NousResearch/hermes-agent/tree/${{ steps.meta.outputs.ref }}).
            
            ### Included Customizations (Niyatna Build):
            * **System Tray Integration**: Background indicator on GNOME Top Bar with Show/Quit menu & toggle.
            * **Close to Tray**: Window minimizes to tray on close button.
            * **Native GNOME GTK Frame**: Window decorations adhere to GNOME GTK theme.
            
            ### Assets included:
            * Linux `.deb` package
            * Linux `.AppImage` standalone binary
          files: |
            apps/desktop/release/*.deb
            apps/desktop/release/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
